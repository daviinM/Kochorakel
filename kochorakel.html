<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Kochorakel wird aktualisiert</title>
  <script>
    const appUrl = new URL("./", window.location.href);
    appUrl.search = window.location.search;
    appUrl.hash = window.location.hash;
    window.location.replace(appUrl.href);
  </script>
</head>
<body>
  <p>Die aktuelle Kochorakel-Version wird geöffnet …</p>
  <p><a href="./">Kochorakel öffnen</a></p>
</body>
</html>
